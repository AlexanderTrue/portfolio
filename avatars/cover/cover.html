<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:660px;height:440px;overflow:hidden;background:#17130e}
  .card{
    position:relative;width:660px;height:440px;background:#17130e;color:#f5efe4;
    font-family:'Manrope',sans-serif;overflow:hidden;
  }
  /* glow accents */
  .glow1{position:absolute;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(217,98,43,.55),transparent 70%);top:-120px;left:-90px}
  .glow2{position:absolute;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(30,111,107,.5),transparent 70%);bottom:-130px;right:60px}

  .left{position:absolute;left:36px;top:62px;width:296px;z-index:3}
  .badge{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
    color:#d9622b;border:1px solid #d9622b;border-radius:99px;padding:5px 12px;
  }
  h1{
    font-family:'Unbounded';font-weight:800;font-size:30px;line-height:1.14;margin-top:14px;
    letter-spacing:-.01em;
  }
  h1 em{font-style:normal;color:#d9622b}
  .sub{margin-top:12px;font-size:14.5px;font-weight:700;color:rgba(245,239,228,.82);line-height:1.45}
  .pill{
    position:absolute;left:36px;bottom:48px;z-index:3;
    background:#d9622b;color:#17130e;font-weight:800;font-size:15px;
    padding:11px 20px;border-radius:99px;box-shadow:0 10px 26px rgba(217,98,43,.45)
  }
  .pill span{opacity:.7;font-weight:800}

  /* photo cards */
  .ph{
    position:absolute;border-radius:12px;overflow:hidden;background:#f5efe4;
    box-shadow:0 18px 40px rgba(0,0,0,.55), 0 0 0 4px rgba(245,239,228,.14);
  }
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{
    position:absolute;left:0;right:0;bottom:0;padding:5px 8px 7px;
    background:linear-gradient(transparent,rgba(0,0,0,.78));
    color:#f5efe4;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-align:center
  }
  .p1{width:180px;height:230px;top:52px;left:362px;transform:rotate(-6deg);z-index:2}
  .p2{width:140px;height:178px;top:236px;left:502px;transform:rotate(8deg);z-index:1}
  .p3{width:124px;height:156px;top:24px;left:518px;transform:rotate(11deg);z-index:3}
</style>
</head>
<body>
<div class="card">
  <div class="glow1"></div><div class="glow2"></div>

  <div class="left">
    <span class="badge">По одному фото · нейросеть</span>
    <h1>AI-аватары<br>и деловые<br><em>портреты</em></h1>
    <div class="sub">LinkedIn, сайт, соцсети и бренд-маскот — из одного вашего фото, без студии</div>
  </div>

  <div class="pill">3 стиля <span>·</span> пакет 5 штук <span>·</span> за 1 день</div>

  <div class="ph p1"><img src="../img/biz_b.png"><div class="cap">деловой</div></div>
  <div class="ph p2"><img src="../img/art_a.png"><div class="cap">арт</div></div>
  <div class="ph p3"><img src="../img/brand_a.png"><div class="cap">маскот</div></div>
</div>
</body>
</html>
